<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>باركود الموقع</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Tahoma, Arial, sans-serif;
      background: #f6f7f4;
      color: #17211c;
    }
    main {
      width: min(520px, calc(100% - 32px));
      text-align: center;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d8ddd5;
      border-radius: 8px;
    }
    img {
      width: min(100%, 360px);
      height: auto;
      image-rendering: pixelated;
    }
    a {
      color: #0f766e;
      overflow-wrap: anywhere;
    }
    p {
      color: #5c665f;
    }
  </style>
</head>
<body>
  <main>
    <h1>باركود الموقع</h1>
    <img src="site-qr.svg" alt="QR code">
    <p><a href="https://sbstr.github.io/oshacademy/">https://sbstr.github.io/oshacademy/</a></p>
  </main>
</body>
</html>
